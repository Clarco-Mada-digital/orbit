name: Argus

# Analyse qualité / sécurité à chaque push et PR, avec notre propre outil Argus.
# NB : on lance le CLI via npx plutôt que l'action `Clarco-Mada-digital/argus@main`,
# car son action.yml est actuellement invalide (erreur de parsing YAML).
# La baseline (.argus/baseline.json) fige l'état actuel : seuls les NOUVEAUX
# problèmes de gravité « high » font échouer le job.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  argus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Analyse Argus
        run: npx --yes github:Clarco-Mada-digital/argus scan . --ci --fail-on high
