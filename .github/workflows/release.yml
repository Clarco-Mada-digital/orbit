name: Release

# Se déclenche quand on pousse un tag de version (ex. v1.3.0).
# Construit Orbit sur Linux, Windows ET macOS et publie les artefacts (AppImage,
# .deb, .exe, .dmg) dans la release GitHub correspondante.
on:
  push:
    tags:
      - 'v*'
  # Permet de lancer manuellement depuis l'onglet « Actions » (utile pour
  # (re)générer les artefacts d'une version déjà publiée).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & publish
        env:
          # Fourni automatiquement par GitHub Actions ; electron-builder l'utilise
          # pour uploader les artefacts dans la release du tag.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:ci

  # Publie les notes de version une fois les builds terminés.
  release-notes:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Les notes viennent de CHANGELOG.md — le même texte que celui
          # affiché dans l'application (onglet « À propos »). npm run release
          # refuse de taguer sans elles, donc ce cas est normalement acquis.
          # Repli sur la liste des commits si le fichier manque (tag ancien).
          if node scripts/changelog.js "$TAG" > notes.md; then
            echo "Notes lues depuis CHANGELOG.md"
          else
            echo "Pas de section CHANGELOG pour $TAG — repli sur les commits"
            gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$TAG" --jq .body > notes.md || echo "Release $TAG" > notes.md
          fi
          # La release existe déjà (créée en brouillon par electron-builder) :
          # on met à jour l'existante ET on la publie si elle était en brouillon.
          gh release edit "$TAG" --repo "${{ github.repository }}" \
            --notes-file notes.md --draft=false
