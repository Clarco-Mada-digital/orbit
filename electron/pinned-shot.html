<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Capture épinglée — Orbit</title>
    <style>
      /* Capture épinglée : une image qui flotte au-dessus de tout, qu'on
         déplace par n'importe quel point et dont la barre n'apparaît qu'au
         survol (ce qu'on veut voir, c'est la capture). */
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #e5e7eb;
        user-select: none;
        cursor: default;
      }
      #frame {
        position: relative;
        height: 100%;
        width: 100%;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid rgba(148, 163, 184, 0.35);
        background: #0b0e14;
        box-shadow: 0 18px 44px rgba(2, 6, 23, 0.55);
      }
      /* Toute la surface déplace la fenêtre : c'est le geste attendu d'une
         vignette flottante. La barre, elle, doit rester cliquable. */
      #shot {
        -webkit-app-region: drag;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: auto;
      }
      #bar {
        position: absolute;
        top: 8px;
        right: 8px;
        display: flex;
        gap: 4px;
        padding: 4px;
        border-radius: 10px;
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.3);
        opacity: 0;
        transition: opacity 0.15s ease;
        -webkit-app-region: no-drag;
      }
      #frame:hover #bar, #bar:focus-within { opacity: 1; }
      button {
        all: unset;
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
        color: #e5e7eb;
      }
      button:hover { background: rgba(148, 163, 184, 0.25); }
      button:focus-visible { outline: 2px solid #6366f1; }
      #close:hover { background: rgba(239, 68, 68, 0.35); }
      #status {
        position: absolute;
        left: 50%;
        bottom: 10px;
        transform: translateX(-50%);
        padding: 5px 12px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.3);
        font-size: 12px;
        opacity: 0;
        transition: opacity 0.2s ease;
        pointer-events: none;
      }
      #status.show { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="frame">
      <img id="shot" alt="Capture épinglée" />
      <div id="bar" role="toolbar" aria-label="Actions de la capture épinglée">
        <button id="opacity" title="Rendre translucide (clic répété)" aria-label="Rendre translucide">◐</button>
        <button id="copy" title="Copier l'image (Ctrl+C)" aria-label="Copier l'image">⧉</button>
        <button id="save" title="Enregistrer l'image (Ctrl+S)" aria-label="Enregistrer l'image">⤓</button>
        <button id="close" title="Fermer (Échap)" aria-label="Fermer">✕</button>
      </div>
      <div id="status" role="status"></div>
    </div>
    <script src="pinned-shot.js"></script>
  </body>
</html>
