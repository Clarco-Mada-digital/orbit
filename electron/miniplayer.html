<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: http: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
    <title>Orbit — Mini-lecteur</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        font-family: system-ui, -apple-system, sans-serif;
        color: #e4e7eb;
        background: transparent;
        overflow: hidden;
        user-select: none;
      }
      .card {
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 9px 11px 8px;
        background: #13131a;
        border: 1px solid #25252f;
        border-radius: 14px;
        -webkit-app-region: drag;
      }
      .row { display: flex; align-items: center; gap: 10px; }
      .art {
        width: 46px; height: 46px;
        border-radius: 10px;
        background: #1c1c24 center/cover no-repeat;
        flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        font-size: 20px; color: #6366f1;
      }
      .art img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
      .meta { flex: 1; min-width: 0; }
      .title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .artist { font-size: 11px; color: #9ca3af; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
      .controls { display: flex; align-items: center; gap: 2px; -webkit-app-region: no-drag; }
      button {
        -webkit-app-region: no-drag;
        width: 28px; height: 28px;
        border: none; border-radius: 8px;
        background: transparent; color: #e4e7eb;
        cursor: pointer; font-size: 14px;
        display: flex; align-items: center; justify-content: center;
      }
      button:hover { background: #25252f; }
      .play { background: #6366f1; color: #fff; }
      .play:hover { background: #818cf8; }
      .top-actions { position: absolute; top: 4px; right: 6px; display: flex; gap: 2px; -webkit-app-region: no-drag; }
      .top-actions button { width: 20px; height: 20px; font-size: 12px; color: #9ca3af; }
      .idle { color: #6b7280; font-size: 12px; }

      .progress { display: flex; align-items: center; gap: 8px; -webkit-app-region: no-drag; }
      .time { font-size: 10px; color: #9ca3af; font-variant-numeric: tabular-nums; flex-shrink: 0; min-width: 30px; }
      .time.end { text-align: right; }
      .track {
        flex: 1; height: 5px; border-radius: 3px;
        background: #25252f; cursor: pointer; position: relative;
      }
      .fill { height: 100%; border-radius: 3px; background: #6366f1; width: 0%; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="row">
        <div class="art" id="art">🎵</div>
        <div class="meta">
          <div class="title" id="title">Rien en lecture</div>
          <div class="artist" id="artist"></div>
        </div>
        <div class="controls">
          <button id="prev" title="Précédent">⏮</button>
          <button id="playpause" class="play" title="Lecture/Pause">⏯</button>
          <button id="next" title="Suivant">⏭</button>
        </div>
      </div>
      <div class="progress">
        <span class="time" id="cur">0:00</span>
        <div class="track" id="track"><div class="fill" id="fill"></div></div>
        <span class="time end" id="dur">0:00</span>
      </div>
      <div class="top-actions">
        <button id="goto" title="Aller à l'application">↗</button>
        <button id="close" title="Fermer">✕</button>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const send = (type, value) => window.mp && window.mp.action(type, value);
      const fmt = (s) => {
        s = Math.max(0, Math.floor(s || 0));
        const m = Math.floor(s / 60);
        const r = s % 60;
        return m + ':' + (r < 10 ? '0' : '') + r;
      };

      $('prev').onclick = () => send('prev');
      $('next').onclick = () => send('next');
      $('playpause').onclick = () => send('playpause');
      $('goto').onclick = () => send('goto');
      $('close').onclick = () => window.mp && window.mp.close();

      // Seek : clic sur la barre → position relative
      $('track').onclick = (e) => {
        const r = $('track').getBoundingClientRect();
        if (r.width > 0) send('seek', Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)));
      };

      window.mp &&
        window.mp.onState((s) => {
          if (!s) {
            $('title').textContent = 'Rien en lecture';
            $('title').classList.add('idle');
            $('artist').textContent = '';
            $('art').innerHTML = '🎵';
            $('playpause').textContent = '⏯';
            $('fill').style.width = '0%';
            $('cur').textContent = '0:00';
            $('dur').textContent = '0:00';
            return;
          }
          $('title').classList.remove('idle');
          $('title').textContent = s.title || s.appName || 'Lecture';
          $('artist').textContent = s.artist || s.appName || '';
          $('playpause').textContent = s.playing ? '⏸' : '▶';
          $('art').innerHTML = s.artwork ? '<img src="' + s.artwork + '" alt="" />' : '🎵';
          const d = s.duration || 0;
          const c = s.currentTime || 0;
          $('fill').style.width = (d > 0 ? Math.min(100, (c / d) * 100) : 0) + '%';
          $('cur').textContent = fmt(c);
          $('dur').textContent = d > 0 ? fmt(d) : '—';
        });
    </script>
  </body>
</html>
