name: Tests

# Tests unitaires (testeur intégré de Node, zéro dépendance) sur les modules
# purs et critiques : partition de session, disposition de barre, raccourcis,
# génération de mots de passe.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
