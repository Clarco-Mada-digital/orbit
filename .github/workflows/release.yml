name: Release

# Se déclenche quand on pousse un tag de version (ex. v1.3.0).
# Construit Orbit sur Linux, Windows ET macOS et publie les artefacts (AppImage,
# .deb, .exe, .dmg) dans la release GitHub correspondante.
on:
  push:
    tags:
      - 'v*'
  # Permet de lancer manuellement depuis l'onglet « Actions » (utile pour
  # (re)générer les artefacts d'une version déjà publiée).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & publish
        env:
          # Fourni automatiquement par GitHub Actions ; electron-builder l'utilise
          # pour uploader les artefacts dans la release du tag.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:ci

  # Génère les notes de version (depuis les commits) une fois les builds terminés.
  release-notes:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Generate & set release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body > notes.md
          gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file notes.md
