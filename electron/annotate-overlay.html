<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Annoter l'écran — Orbit</title>
    <style>
      /* Couche d'annotation plein écran. Elle est TRANSPARENTE et se place
         au-dessus de tout : une capture d'écran ou un enregistrement la
         reprennent telle quelle, sans que le studio ait à la composer. */
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #e5e7eb;
        user-select: none;
      }
      #board { position: absolute; inset: 0; }
      /* En mode pointeur, la toile ne reçoit rien : les clics vont à
         l'application qui est dessous (le processus principal rend aussi la
         fenêtre traversante). */
      body[data-mode='pointer'] #board { pointer-events: none; }
      body[data-mode='draw'] #board { cursor: crosshair; }

      #palette {
        position: absolute;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px;
        border-radius: 16px;
        border: 1px solid rgba(148, 163, 184, 0.3);
        background: rgba(15, 23, 42, 0.94);
        box-shadow: 0 18px 44px rgba(2, 6, 23, 0.55);
        font-size: 13px;
      }
      #palette.dragging { opacity: 0.85; }
      .row { display: flex; align-items: center; gap: 4px; }
      .row.second { justify-content: center; gap: 6px; padding: 0 4px; }
      button {
        all: unset;
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 9px;
        cursor: pointer;
        font-size: 15px;
        line-height: 1;
        color: #e5e7eb;
      }
      button:hover { background: rgba(148, 163, 184, 0.25); }
      button:focus-visible { outline: 2px solid #6366f1; }
      button[aria-pressed='true'] {
        background: rgba(99, 102, 241, 0.35);
        box-shadow: inset 0 0 0 1px rgba(165, 180, 252, 0.65);
      }
      #close:hover { background: rgba(239, 68, 68, 0.35); }
      .sep { width: 1px; height: 20px; background: rgba(148, 163, 184, 0.35); margin: 0 2px; }
      .swatch { width: 20px; height: 20px; border-radius: 50%; }
      .grip { cursor: grab; padding: 0 4px; color: #94a3b8; font-size: 15px; }
      .hint {
        max-width: 330px;
        padding: 0 4px;
        color: #fbbf24;
        font-size: 11px;
        text-align: center;
      }
    </style>
  </head>
  <body data-mode="pointer">
    <canvas id="board"></canvas>
    <div id="palette" role="toolbar" aria-label="Annotation de l'écran">
      <div class="row">
        <span class="grip" id="grip" title="Déplacer la palette">⠿</span>
        <button data-tool="pointer" title="Pointeur — rendre la main aux applications" aria-label="Pointeur">➤</button>
        <button data-tool="laser" title="Pointeur laser" aria-label="Pointeur laser">🔴</button>
        <button data-tool="pen" title="Stylo" aria-label="Stylo">✏️</button>
        <button data-tool="highlight" title="Surligneur" aria-label="Surligneur">🖍️</button>
        <button data-tool="arrow" title="Flèche" aria-label="Flèche">↗</button>
        <button data-tool="rect" title="Rectangle" aria-label="Rectangle">▭</button>
        <button data-tool="ellipse" title="Ellipse" aria-label="Ellipse">◯</button>
        <span class="sep"></span>
        <button id="undo" title="Annuler le dernier tracé" aria-label="Annuler">↶</button>
        <button id="clear" title="Tout effacer" aria-label="Tout effacer">🧽</button>
        <span class="sep"></span>
        <button id="close" title="Fermer (Échap)" aria-label="Fermer">✕</button>
      </div>
      <div class="row second" id="colors"></div>
      <div class="hint" id="hint"></div>
    </div>
    <script src="annotate-overlay.js"></script>
  </body>
</html>
