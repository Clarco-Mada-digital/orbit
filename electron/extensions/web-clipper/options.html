<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Web Clipper — bibliothèque</title>
    <style>
      :root { color-scheme: dark; font: 14px/1.5 system-ui, sans-serif; background: #09090b; color: #f4f4f5; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      main { width: min(900px, 100%); margin: 0 auto; padding: 32px 20px 64px; }
      header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
      h1 { margin: 0; font-size: 24px; }
      .subtitle, .muted { color: #a1a1aa; }
      .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
      input[type="search"] { flex: 1 1 240px; min-height: 40px; padding: 8px 12px; border: 1px solid #3f3f46; border-radius: 10px; background: #18181b; color: inherit; font: inherit; }
      button { min-height: 38px; padding: 8px 12px; border: 1px solid #3f3f46; border-radius: 9px; background: #27272a; color: inherit; font: inherit; cursor: pointer; }
      button:hover { border-color: #818cf8; background: #312e81; }
      button:disabled { cursor: not-allowed; opacity: .5; }
      .primary { background: #4f46e5; border-color: #6366f1; }
      .danger { color: #fca5a5; }
      .clip-list { display: grid; gap: 12px; }
      article { min-width: 0; padding: 16px; border: 1px solid #27272a; border-radius: 14px; background: #18181b; }
      .clip-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
      h2 { margin: 0 0 4px; font-size: 16px; }
      .clip-url { display: block; max-width: 100%; overflow: hidden; color: #a5b4fc; text-overflow: ellipsis; white-space: nowrap; }
      time, .kind { color: #a1a1aa; font-size: 12px; }
      .kind { display: inline-block; margin-top: 8px; padding: 2px 8px; border-radius: 999px; background: #27272a; }
      pre { max-height: 160px; overflow: auto; margin: 12px 0; padding: 10px; border-radius: 8px; background: #09090b; color: #d4d4d8; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
      .clip-actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .empty { padding: 48px 16px; border: 1px dashed #3f3f46; border-radius: 14px; color: #a1a1aa; text-align: center; }
      #status { min-height: 20px; margin: 10px 0; color: #86efac; }
      @media (max-width: 560px) { main { padding: 22px 14px 40px; } .clip-head { display: block; } .clip-head time { display: block; margin-top: 8px; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Web Clipper</h1>
          <div class="subtitle">Vos captures restent dans le stockage local d’Orbit.</div>
        </div>
        <button id="export-all" class="primary" type="button">Exporter tout en Markdown</button>
      </header>
      <div class="tools">
        <input id="search" type="search" placeholder="Rechercher dans les captures…" aria-label="Rechercher dans les captures">
        <button id="refresh" type="button">Actualiser</button>
        <button id="clear-all" class="danger" type="button">Tout supprimer</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <section id="clip-list" class="clip-list" aria-label="Captures enregistrées"></section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
