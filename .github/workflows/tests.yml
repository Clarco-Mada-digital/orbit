name: Tests

# Deux jobs volontairement séparés :
#
#  - `test` : testeur intégré de Node. La suite est conçue pour passer AU VERT
#    sans `node_modules` (on doit pouvoir vérifier une modification sans rien
#    installer) : les quelques tests qui exercent une vraie bibliothèque —
#    react-markdown, zustand — s'ignorent alors proprement, avec une raison
#    lisible (voir test/helpers/optional-dep.mjs). D'où le `npm ci` ICI : c'est
#    ce qui les fait réellement s'exécuter, au lieu d'être ignorés partout.
#
#  - `lint` : ESLint a besoin de ses paquets, d'où le `npm ci`. Le plafond
#    `--max-warnings` (dans package.json) empêche la dette de repartir à la
#    hausse : on le baisse au fur et à mesure qu'on résorbe les avertissements.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
