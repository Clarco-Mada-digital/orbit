name: Argus

# Analyse qualité / sécurité à chaque push et PR, avec notre propre outil Argus.
# NB : on lance le CLI via npx plutôt que l'action `Clarco-Mada-digital/argus@main`,
# car son action.yml est actuellement invalide (erreur de parsing YAML).
#
# Les exceptions précises et motivées vivent dans `argus.config.json` à la
# racine, pas dans une baseline qui masquerait indistinctement la dette.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  argus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Analyse Argus
        run: npx --yes github:Clarco-Mada-digital/argus#490dcca3ac3624176b177c5f21442d4086952f4d scan . --ci --fail-on high
